name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The unit tests, then the game tests on the NeoForge CMS ships (no Sable), then Sable's on the one it needs.
      - run: ./gradlew build runGameTestServer
      - run: ./gradlew runGameTestServer -PsableTests
