plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The -P switches: each turns on one test or dev source set (see "Test and dev source sets" below).
def flag = { String name -> providers.gradleProperty(name).isPresent() }
def sableTests = flag('sableTests')

// Optional regression check against JEI's real crafting display predicate; never a runtime dependency.
if (flag('recipeViewerTest')) {
    repositories { maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } } }
    sourceSets.test.java.srcDir('src/recipeViewerTest/java')
    dependencies { testImplementation 'mezz.jei:jei-1.21.1-neoforge:19.27.0.346@jar' }
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
}

neoForge {
    // Sable 2.0.6, loaded for its game tests only, needs a newer NeoForge than CMS does; every other run, the game
    // tests' included, is on the one CMS ships against.
    version = sableTests ? '21.1.228' : project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            // Just CMS as it ships; a run that needs a test or dev source set loads it on top (see loads below).
            loadedMods = [mods."${mod_id}"]
        }
    }

    // Puts Minecraft on the test classpath, so client classes like StreamSound can be tested.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
        loadedMods = [mods."${mod_id}"]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    // Puts blocks on Sable sub-levels (moving structures, e.g. Create: Aeronautics ships) where they really are;
    // does nothing without Sable. Bundled in the jar.
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}")) {
        version { strictly "[${sable_companion_version},)"; prefer sable_companion_version }
    }

    // Mods CMS integrates with when present, so `gradlew runClient` / `runServer` have them. Dev runs only:
    // they aren't part of the built jar, and are reached by reflection.
    localRuntime("maven.modrinth:sound-physics-remastered:${sound_physics_version}")
    // Mods that aren't on a Maven go in libs/; the folder is gitignored.
    localRuntime(fileTree(dir: 'libs', include: '*.jar'))

    // Direct P2P (see p2p/Transport). Its Java part is bundled in the jar; its POM's native dependency is left out,
    // since the client unpacks the native library bundled below itself (dedicated servers never load it). Exactly
    // this version: another one's JNI may not match that library, so a mod wanting another fails to load instead.
    jarJar(implementation("dev.onvoid.webrtc:webrtc-java")) {
        version { strictly "[${webrtc_version}]" }
        transitive = false
    }

    if (sableTests) {
        implementation('maven.modrinth:sable:2.0.6+mc1.21.1') { transitive = false }
    }

    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// Test and dev source sets. Each is compiled against main (and the sets it builds on) and is part of the mod only in
// the runs that load it, so ordinary runs, the unit tests and the jar never see it; there it shares main's packages.
def devSet = { String name, SourceSet... uses ->
    def set = sourceSets.create(name) // src/<name>/java and resources
    configurations[set.implementationConfigurationName].extendsFrom(configurations.implementation)
    configurations[set.compileOnlyConfigurationName].extendsFrom(configurations.compileOnly)
    configurations[set.runtimeOnlyConfigurationName].extendsFrom(configurations.runtimeOnly, configurations.localRuntime)
    dependencies.add(set.implementationConfigurationName, sourceSets.main.output)
    uses.each { dependencies.add(set.implementationConfigurationName, it.output) }
    neoForge.addModdingDependenciesTo(set)
    return set
}
// The source sets each run loads on top of main; the last one's classpath (which has the others') is the run's.
def loads = [:].withDefault { [] }

// Game tests run on the NeoForge CMS ships, without Sable. -PsableTests adds Sable and its own tests (on the NeoForge
// Sable needs); -PlauncherServerTest runs the launcher's tests instead, and -PcellPlantTest those with the Plant fixture.
def gametest = devSet('gametest')
def cellPlantTest = flag('cellPlantTest')
if (flag('launcherServerTest') || cellPlantTest) {
    loads.gameTestServer << devSet('launcherServerTest')
    neoForge.runs.gameTestServer {
        gameDirectory = file(cellPlantTest ? 'run-launcher-server-test-plant'
                : providers.gradleProperty('launcherServerDirectory').orElse('run-launcher-server-test').get())
        jvmArgument '-Xmx2G'
    }
} else {
    loads.gameTestServer << gametest
    if (sableTests) {
        loads.gameTestServer << devSet('sableGametest', gametest)
    }
    neoForge.runs.gameTestServer.gameDirectory = file(sableTests ? 'build/sable-gametest' : 'build/gametest')
}
// Game tests never ask a CMS API that happens to run on this computer (one refuses their made-up tracks, which then end
// at once): their server's apiUrl is one nothing listens on, so a track's length stays unknown, as with no API at all.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def config = neoForge.runs.gameTestServer.gameDirectory.get().file('config/cms-server.toml').asFile
        def line = 'apiUrl = "http://127.0.0.1:1"'
        def text = config.exists() ? config.text : ''
        config.parentFile.mkdirs()
        config.text = text =~ /(?m)^apiUrl = / ? text.replaceAll(/(?m)^apiUrl = .*$/, line) : line + '\n' + text
    }
}

// A tiny registry fixture verifies both branches of the optional Plant recipe without making Plant a dependency.
if (cellPlantTest) {
    def fixture = sourceSets.create('plantCompatFixture') {
        java.srcDir('src/plantCompatTest/java')
        resources.srcDir('src/plantCompatTest/resources')
        compileClasspath = sourceSets.main.compileClasspath
    }
    def fixtureJar = tasks.register('plantCellCompatJar', Jar) {
        from fixture.output
        archiveFileName = 'cms-plant-material-fixture.jar'
        destinationDirectory = layout.buildDirectory.dir('plant-compat-fixture')
    }
    neoForge.runs.gameTestServer.systemProperty 'cms.cellPlantTest', 'true'
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn fixtureJar
        doFirst {
            copy { from fixtureJar.flatMap { it.archiveFile }; into neoForge.runs.gameTestServer.gameDirectory.get().dir('mods').asFile }
        }
    }
}

if (flag('launcherDebug')) {
    loads.client << devSet('launcherDebug')
    neoForge.runs.client {
        gameDirectory = file('run-launcher-debug')
        programArguments.addAll('--username', 'DiscTester', '--width', '1280', '--height', '760')
        jvmArgument '-Xmx3G'
    }
}

// The lighting lab (lightingDemo) and what builds on it: the benchmark, the network test, and with -PsableTests the
// Sable demo. Opt-in, so ordinary runClient saves are untouched.
def lightingBenchmark = flag('lightingBenchmark')
def lightingNetworkTest = flag('lightingNetworkTest')
if (flag('lightingDemo') || lightingBenchmark || lightingNetworkTest) {
    def lightingDemo = devSet('lightingDemo')
    def sableLightingDemo = sableTests && !lightingBenchmark
    loads.client << lightingDemo
    if (sableLightingDemo) {
        loads.client << devSet('sableLightingDemo', lightingDemo)
    }
    neoForge.runs.client {
        gameDirectory = file(sableLightingDemo ? 'run-sable-lighting-demo' : 'run-lighting-demo')
        systemProperty 'cms.sableLightingDemo', Boolean.toString(sableLightingDemo)
        programArguments.addAll('--width', '1280', '--height', '800')
    }
    if (lightingBenchmark) {
        loads.client << devSet('lightingBenchmark', lightingDemo)
        neoForge.runs.client {
            gameDirectory = file('run-lighting-benchmark')
            systemProperty 'cms.lightingDisplays', providers.gradleProperty('lightingDisplays').orElse('1').get()
            systemProperty 'cms.lightingDense', flag('lightingDense').toString()
            systemProperty 'cms.benchmarkCapture', flag('benchmarkCapture').toString()
            jvmArgument '-Xmx3G'
        }
    }
    if (lightingNetworkTest) {
        def network = devSet('lightingNetworkTest', lightingDemo)
        neoForge.runs {
            analysisServer {
                server()
                gameDirectory = file('build/lighting-network/server')
                programArgument '--nogui'
            }
            analysisA {
                client()
                gameDirectory = file('build/lighting-network/a')
                programArguments.addAll('--username', 'CMS_Analyst', '--quickPlayMultiplayer', '127.0.0.1:25584', '--width', '800', '--height', '500')
            }
            analysisB {
                client()
                gameDirectory = file('build/lighting-network/b')
                programArguments.addAll('--username', 'CMS_Observer', '--quickPlayMultiplayer', '127.0.0.1:25585', '--width', '800', '--height', '500')
            }
        }
        ['analysisServer', 'analysisA', 'analysisB'].each { name ->
            loads[name] += [lightingDemo, network]
            neoForge.runs.named(name) {
                systemProperty 'cms.lightingNetworkTest', 'true'
                systemProperty 'cms.demoSeconds', providers.gradleProperty('lightingNetworkSeconds').orElse('180').get()
                jvmArgument '-Xmx2G'
            }
        }
    }
}

// Speaker stress test: a dedicated server and a client that reconnects on its own (see scripts/speaker_stress.py).
if (flag('speakerStress')) {
    def stress = devSet('speakerStress')
    neoForge.runs {
        stressServer {
            server()
            gameDirectory = file('build/speaker-stress/server')
            programArgument '--nogui'
        }
        stressClient {
            client()
            gameDirectory = file('build/speaker-stress/client')
            programArguments.addAll('--username', 'CMS_Listener', '--width', '960', '--height', '600')
        }
    }
    ['stressServer', 'stressClient'].each { name ->
        loads[name] << stress
        neoForge.runs.named(name) { jvmArgument '-Xmx3G' }
    }
}

// Each run that loads a set loads CMS as main plus those sets, as one mod.
loads.each { String run, List<SourceSet> sets ->
    def mod = neoForge.mods.create("${mod_id}_${run}") {
        sourceSet(sourceSets.main)
        sets.each { sourceSet(it) }
    }
    neoForge.runs.named(run) {
        loadedMods = [mod]
        sourceSet = sets.last()
    }
}

// Minecraft 26.1's note samples, verified against Mojang's asset index.
def noteSounds = [
    trumpet: 'f2c01a26fb57688fc86be1c3f3953d6bfbf3bdb8',
    trumpet_exposed: '39a5792432cf0c1f858b118f8058194f099affbc',
    trumpet_weathered: '77569a04f9b225f23dbbde4fc973bdff50798f25',
    trumpet_oxidized: '3bbd246c8aeaabdbd50fa7d6ffbe08ec5f86fefb'
]
def noteResources = layout.buildDirectory.dir('generated/note-sounds')
var downloadNoteSounds = tasks.register('downloadNoteSounds') {
    inputs.property 'sounds', noteSounds
    outputs.dir noteResources
    doLast {
        def destination = noteResources.get().dir('assets/create_media_systems/sounds/note').asFile
        destination.mkdirs()
        noteSounds.each { name, hash ->
            def output = new File(destination, "${name}.ogg")
            if (output.exists() && output.bytes.digest('SHA-1') == hash) return
            def url = "https://resources.download.minecraft.net/${hash.substring(0, 2)}/${hash}"
            logger.lifecycle("Downloading ${url}")
            def bytes = new URL(url).bytes
            if (bytes.digest('SHA-1') != hash) {
                throw new GradleException("The ${name} download does not match Mojang's SHA-1; run downloadNoteSounds again")
            }
            output.bytes = bytes
        }
    }
}
sourceSets.main.resources.srcDir(files(noteResources).builtBy(downloadNoteSounds))

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        create_mod_version: create_mod_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-Xlint:deprecation'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}


idea.module {
    downloadSources = true
    downloadJavadoc = true
}
