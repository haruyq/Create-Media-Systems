plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir('third_party/gervill/java')

// The -P switches: each adds optional game tests (see "Game tests" below).
def flag = { String name -> providers.gradleProperty(name).isPresent() }
def sableTests = flag('sableTests')

repositories {
    // JEI, for the unit test against its real crafting display predicate; never a runtime dependency.
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
}

neoForge {
    // Sable 2.0.6, loaded for its game tests only, needs a newer NeoForge than CMS does; every other run, the game
    // tests' included, is on the one CMS ships against.
    version = sableTests ? '21.1.228' : project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            // Just CMS as it ships; runGameTestServer loads the game tests on top (see "Game tests" below).
            loadedMods = [mods."${mod_id}"]
        }
    }

    // Puts Minecraft on the test classpath, so client classes like StreamSound can be tested.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
        loadedMods = [mods."${mod_id}"]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    // Puts blocks on Sable sub-levels (moving structures, e.g. Create: Aeronautics ships) where they really are;
    // does nothing without Sable. Bundled in the jar.
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}")) {
        version { strictly "[${sable_companion_version},)"; prefer sable_companion_version }
    }

    // Mods CMS integrates with when present, so `gradlew runClient` / `runServer` have them. Dev runs only:
    // they aren't part of the built jar, and are reached by reflection.
    localRuntime("maven.modrinth:sound-physics-remastered:${sound_physics_version}")
    // Mods that aren't on a Maven go in libs/; the folder is gitignored.
    localRuntime(fileTree(dir: 'libs', include: '*.jar'))

    // Direct P2P (see p2p/Transport). Its Java part is bundled in the jar; its POM's native dependency is left out,
    // since the client unpacks the native library bundled below itself (dedicated servers never load it). Exactly
    // this version: another one's JNI may not match that library, so a mod wanting another fails to load instead.
    jarJar(implementation("dev.onvoid.webrtc:webrtc-java")) {
        version { strictly "[${webrtc_version}]" }
        transitive = false
    }

    if (sableTests) {
        implementation('maven.modrinth:sable:2.0.6+mc1.21.1') { transitive = false }
    }

    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('mezz.jei:jei-1.21.1-neoforge:19.27.0.346@jar')
}

// Game tests: src/gametest, compiled against main and part of the mod only in runGameTestServer, so ordinary runs, the
// unit tests and the jar never see it; it shares main's packages. They run on the NeoForge CMS ships, without Sable.
// -PsableTests adds Sable and its own tests (src/gametest/sable, on the NeoForge Sable needs); -PcellPlantTest adds the
// Plant fixture mod (src/gametest/plant).
def gametest = sourceSets.create('gametest')
if (sableTests) {
    gametest.java.srcDir('src/gametest/sable/java')
}
configurations.gametestImplementation.extendsFrom(configurations.implementation)
configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
configurations.gametestRuntimeOnly.extendsFrom(configurations.runtimeOnly, configurations.localRuntime)
dependencies.gametestImplementation(sourceSets.main.output)
neoForge.addModdingDependenciesTo(gametest)
def gametestMod = neoForge.mods.create("${mod_id}_gametest") {
    sourceSet(sourceSets.main)
    sourceSet(gametest)
}
def cellPlantTest = flag('cellPlantTest')
neoForge.runs.gameTestServer {
    gameDirectory = file(cellPlantTest ? 'build/gametest-plant' : sableTests ? 'build/sable-gametest' : 'build/gametest')
    jvmArgument '-Xmx2G'
    loadedMods = [gametestMod]
    sourceSet = gametest
}
// Game tests never ask a CMS API that happens to run on this computer (one refuses their made-up tracks, which then end
// at once): their server's apiUrl is one nothing listens on, so a track's length stays unknown, as with no API at all.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def config = neoForge.runs.gameTestServer.gameDirectory.get().file('config/cms-server.toml').asFile
        def line = 'apiUrl = "http://127.0.0.1:1"'
        def text = config.exists() ? config.text : ''
        config.parentFile.mkdirs()
        config.text = text =~ /(?m)^apiUrl = / ? text.replaceAll(/(?m)^apiUrl = .*$/, line) : line + '\n' + text
    }
}

// A tiny registry fixture verifies both branches of the optional Plant recipe without making Plant a dependency.
if (cellPlantTest) {
    def fixture = sourceSets.create('plantCompatFixture') {
        java.srcDir('src/gametest/plant/java')
        resources.srcDir('src/gametest/plant/resources')
        compileClasspath = sourceSets.main.compileClasspath
    }
    def fixtureJar = tasks.register('plantCellCompatJar', Jar) {
        from fixture.output
        archiveFileName = 'cms-plant-material-fixture.jar'
        destinationDirectory = layout.buildDirectory.dir('plant-compat-fixture')
    }
    neoForge.runs.gameTestServer.systemProperty 'cms.cellPlantTest', 'true'
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn fixtureJar
        doFirst {
            copy { from fixtureJar.flatMap { it.archiveFile }; into neoForge.runs.gameTestServer.gameDirectory.get().dir('mods').asFile }
        }
    }
}

// Minecraft 26.1's note samples, verified against Mojang's asset index.
def noteSounds = [
    trumpet: 'f2c01a26fb57688fc86be1c3f3953d6bfbf3bdb8',
    trumpet_exposed: '39a5792432cf0c1f858b118f8058194f099affbc',
    trumpet_weathered: '77569a04f9b225f23dbbde4fc973bdff50798f25',
    trumpet_oxidized: '3bbd246c8aeaabdbd50fa7d6ffbe08ec5f86fefb'
]
def noteResources = layout.buildDirectory.dir('generated/note-sounds')
var downloadNoteSounds = tasks.register('downloadNoteSounds') {
    inputs.property 'sounds', noteSounds
    outputs.dir noteResources
    doLast {
        def destination = noteResources.get().dir('assets/create_media_systems/sounds/note').asFile
        destination.mkdirs()
        noteSounds.each { name, hash ->
            def output = new File(destination, "${name}.ogg")
            if (output.exists() && output.bytes.digest('SHA-1') == hash) return
            def url = "https://resources.download.minecraft.net/${hash.substring(0, 2)}/${hash}"
            logger.lifecycle("Downloading ${url}")
            def bytes = new URL(url).bytes
            if (bytes.digest('SHA-1') != hash) {
                throw new GradleException("The ${name} download does not match Mojang's SHA-1; run downloadNoteSounds again")
            }
            output.bytes = bytes
        }
    }
}
sourceSets.main.resources.srcDir(files(noteResources).builtBy(downloadNoteSounds))

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        create_mod_version: create_mod_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add '-Xlint:deprecation'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // ApiCompatibilityTest: -PrecordApi re-records the API, -PlegacyJars=a.jar,b.jar what released add-ons link to.
    if (providers.gradleProperty('recordApi').isPresent()) {
        systemProperty 'api.record', 'true'
    }
    systemProperty 'api.legacyJars', providers.gradleProperty('legacyJars').getOrElse('')
    systemProperty 'api.project', projectDir.absolutePath
}


idea.module {
    downloadSources = true
    downloadJavadoc = true
}
